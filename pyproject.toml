[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "customer-service-agent"
version = "0.1.0"
description = "Intelligent customer service agent built with LangGraph, ReAct, and MySQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "rayyichen310" }
]
dependencies = [
  "fastapi>=0.115.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.3.0",
  "langgraph>=0.3.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "pymysql>=1.1.1",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.3",
]

[project.scripts]
customer-agent = "customer_service_agent.cli:main"
customer-agent-api = "customer_service_agent.api:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

